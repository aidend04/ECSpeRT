            position: absolute;
            background-color: #333;
            color: #fff;
            padding: 10px;

            bottom: 100%;

            transform: translateX(-50%);

            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .user-widget:hover .tooltip {
            visibility: visible;
            opacity: 1;

        function promptNewCalendar() {

    function createNewCalendar(year, month) {
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const calendarBody = document.getElementById("calendar-body");

        // Clear previous calendar
        calendarBody.innerHTML = "";

        // Create a header row with the month and year
        const headerRow = document.createElement("tr");
        const headerCell = document.createElement("td");
        headerCell.colSpan = 5; // Span across the entire week
        headerCell.className = "py-4 px-4 text-center font-bold text-lg border-b"; // You can adjust the styling as needed
        headerCell.innerText = `${monthNames[month]} ${year}`;
        headerRow.appendChild(headerCell);
        calendarBody.appendChild(headerRow);

        let row = document.createElement("tr");

        // Add empty cells for days before the first weekday of the month
        let paddingDays = firstDay >= 1 && firstDay <= 5 ? firstDay - 1 : 0;
        for (let i = 0; i < paddingDays; i++) {
            const cell = document.createElement("td");
            cell.className = "py-2 px-4 border";
            row.appendChild(cell);
        }

        // Add cells for each day in the month
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            const dayOfWeek = date.getDay();

            // Skip weekends
            if (dayOfWeek >= 1 && dayOfWeek <= 5) {
                const cell = document.createElement("td");
                cell.className = "py-2 px-4 border";


                const dayDiv = document.createElement("div");
                dayDiv.className = "font-semibold mb-2";
                dayDiv.id = day;
                dayDiv.innerText = day;

                const userDiv = document.createElement("div");
                userDiv.id = `day-${day}`;
                userDiv.className = "user-slot";

                cell.appendChild(dayDiv);
                cell.appendChild(userDiv);
                row.appendChild(cell);
            }

            // Add the row to the calendar body at the end of the week or month end
            if (date.getDay() === 5) { // End of week (Friday)
                calendarBody.appendChild(row);
                row = document.createElement("tr");
            }
        }

        // Fill the last row with empty cells if necessary
        if (row.children.length > 0) {
            const lastDay = new Date(year, month + 1, 0).getDay();
            if (lastDay >= 1 && lastDay <= 5) {
                for (let i = lastDay; i < 5; i++) {
                    const cell = document.createElement("td");
                    cell.className = "py-2 px-4 border";
                    row.appendChild(cell);
                }
            }
            calendarBody.appendChild(row);
        }

        let calHtml = document.getElementById('cal').innerHTML;

        console.log(calHtml);

        saveCal(calHtml);

        convertCalendarToForm();

    }

    function convertCalendarToForm() {
        let calendarView = document.getElementById('calendar-view').cloneNode(true);
        const calendarHtml = calendarView.innerHTML;

        // Create a temporary div to manipulate the calendar HTML
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = calendarHtml;

        // Get the month and year from the table header
        const monthYearHeader = tempDiv.querySelector('tbody tr td');
        const monthYearText = monthYearHeader ? monthYearHeader.textContent.trim() : 'No month/year found';

        // Add a header for the form with month and year
        const formHeader = document.createElement('div');
        formHeader.className = 'text-center font-bold text-lg mb-4';
        formHeader.innerText = `Availability Form - ${monthYearText}`;
        tempDiv.insertBefore(formHeader, tempDiv.firstChild);

        // Select all user-slot divs and replace their content with checkboxes

        let days = [];
        const userSlots = tempDiv.querySelectorAll('.user-slot');
        userSlots.forEach(slot => {
            const day = slot.id.split('-')[1]; // Extract the day number from the id

            // Create the checkbox HTML
            const checkboxHtml = `
            <input type="checkbox" id="available-${day}" name="available-${day}" value="day-${day}">
            <label for="available-${day}" class="ml-2">Available on ${day}</label>
        `;

            // Replace the content of the user-slot div with the checkbox HTML
            slot.innerHTML = checkboxHtml;
            days.push(day);
        });

        // Create a form and append the modified calendar HTML
        const form = document.createElement('form');
        form.id = 'overnight';
        form.className = 'space-y-4'; // Adjust spacing as needed
        form.innerHTML = tempDiv.innerHTML;

        // Add a submit button
        const submitButton = document.createElement('button');
        submitButton.type = 'submit';
        submitButton.id = 'submit-btn';
        submitButton.className = 'bg-blue-500 text-white py-2 px-4 rounded mx-auto block mt-4'; // Center and add top margin
        submitButton.innerText = 'Submit Availability';
        form.appendChild(submitButton);


        // Replace the existing calendar view with the new form
        calendarView.innerHTML = '';
        calendarView.appendChild(form);

        fetch('/data/overnightForm', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({html: calendarView.innerHTML, days: days})
        })
    }

   async function createPdf() {
        // Ask for the month and year
        let monthYear = prompt('Please enter the month and year for this calendar (e.g., September 2024):');
        if (!monthYear) {
            alert('Month and year are required to generate the PDF.');
            return;
        }

        confirm('This will email a schedule to all provided emails.');
        alert('Creating PDF...');

        // Retrieve the table data
        let calendar = document.getElementById('cal');
        if (!calendar) {
            alert('No calendar found.');
            return;
        }

        // Extract headers (days of the week) and the data for each day
        let headers = Array.from(calendar.querySelectorAll('th')).map(th => th.innerText);

        // Skip the first row in the data extraction
        let rows = Array.from(calendar.querySelectorAll('tbody tr')).slice(1);

        let data = rows.map(row => {
            return Array.from(row.querySelectorAll('td')).map(td => {
                // Extract text from each cell and clean it up
                return td.innerText.trim();
            });
        });

        // Convert logo image to Base64 function
        const convertImageToBase64 = (url) => {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.onload = function () {
                    const reader = new FileReader();
                    reader.onloadend = function () {
                        resolve(reader.result);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(xhr.response);
                };
                xhr.onerror = reject;
                xhr.open('GET', url);
                xhr.responseType = 'blob';
                xhr.send();
            });
        };

        // Load jsPDF from the module
        const { jsPDF } = window.jspdf;

        // Create PDF
        const pdf = new jsPDF('landscape', 'mm', 'a4');

        // Convert logo image to Base64 and add to PDF
        const logoUrl = '../images/logo.jpg'; // Update this path as needed
        convertImageToBase64(logoUrl).then(logoDataUrl => {
            // Add the logo to the PDF
            pdf.addImage(logoDataUrl, 'JPEG', 10, 10, 40, 20);

            // Add header text to the PDF
            pdf.setFontSize(22);
            pdf.setTextColor(33, 150, 243);
            pdf.setFont("helvetica", "bold");
            pdf.text('ECSpeRT Overnight Schedule', 60, 20);

            pdf.setFontSize(16);
            pdf.setTextColor(0, 0, 0);
            pdf.setFont("helvetica", "normal");
            pdf.text(`Month & Year: ${monthYear}`, 60, 30);

            // Calculate available space for the table
            const pageHeight = pdf.internal.pageSize.height;
            const pageWidth = pdf.internal.pageSize.width;
            const startY = 40;
            const tableHeight = pageHeight - startY - 20; // 20 for bottom margin
            const tableWidth = pageWidth - 20; // 10mm margin on each side

            // Adjust font size and cell height dynamically
            const fontSize = 10; // Smaller font size for fitting content
            const cellHeight = 25; // Adjusted cell height
            const tableOptions = {
                startY: startY,
                head: [headers],
                body: data,
                theme: 'grid',
                styles: {
                    fontSize: fontSize,
                    cellPadding: 2,
                    overflow: 'linebreak',
                    halign: 'center',
                    valign: 'middle',
                    lineWidth: 0.1,
                    lineColor: [0, 0, 0],
                    minCellHeight: cellHeight,
                    cellWidth: 'wrap', // Ensures text wrapping
                },
                headStyles: {
                    fillColor: [30, 30, 30],
                    textColor: 255,
                    fontStyle: 'bold',
                },
                alternateRowStyles: {
                    fillColor: [242, 242, 242]
                },
                tableWidth: tableWidth,
                margin: { left: 10, right: 10 }, // Margin for entire table
                columnStyles: {
                    0: { cellWidth: 30 }, // Time column width
                    1: { cellWidth: (tableWidth - 30) / (headers.length - 1) },
                    // Adjust the width for each day column
                },
                didParseCell: function (data) {
                    if (data.section === 'body' && data.cell.raw) {
                        data.cell.styles.fillColor = [255, 255, 255];
                        data.cell.styles.textColor = [0, 0, 0];
                        data.cell.styles.fontStyle = 'normal';
                    }
                },
                didDrawCell: function (data) {
                    // Optional: Add any additional styling or conditional formatting here
                }
            };

            // Draw the table
            pdf.autoTable(tableOptions);

            // Generate a blob URL and open in a new window
            const pdfBlob = pdf.output('blob');
            const pdfUrl = URL.createObjectURL(pdfBlob);
            window.open(pdfUrl, '_blank');

            // Send PDF to server
            const formData = new FormData();
            formData.append('pdf', pdfBlob, 'calendar.pdf');

            fetch('/admin/send-night-pdf', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => console.log('PDF sent successfully:', data.message))
                .catch(error => console.error('Error sending PDF:', error));

        }).catch(error => {
            console.error('Error converting image to Base64:', error);
        });
    }



    </script>
