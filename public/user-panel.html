<!DOCTYPE html>
<html class="h-full bg-white">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body class="h-full bg-gray-100">

        <nav class="bg-white shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex">
                        <div class="flex-shrink-0 flex items-center">
                            <img class="h-8 w-8" src="https://tailwindui.com/img/logos/workflow-mark-indigo-600.svg" alt="Logo">
                        </div>
                        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                            <a href="/admin"
                                class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Dashboard</a>
                            <a href="/admin/user-panel"
                                class="border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">User
                                Panel</a>
                            <a href="/logout"
                                class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

    <div class="flex items-center justify-center">
            <div class="p-6 bg-gray-200 text-gray-800 rounded-lg shadow-lg w-full max-w-4xl mx-auto">
                <!-- Header for the entire panel -->
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-2xl font-bold">User Status Overview</h1>
                    <span class="text-sm text-gray-600">August 2024</span>
                </div>
            
                <!-- Verified Users Section -->
                <div id="verifiedSec" x-data="{ open: true }" class="mb-4 rounded-lg shadow-lg bg-white">
                    <button @click="open = !open"
                        class="w-full text-left p-4 bg-blue-500 text-white rounded-t-lg flex items-center justify-between">
                        <h2 class="text-lg font-semibold">Verified Users</h2>
                        <svg :class="{ 'transform rotate-180': open }" class="w-5 h-5 transition-transform" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="verified" x-show="open" >
                    </div>
                </div>
            
                <!-- Unverified Users Section -->
                <div x-data="{ open: true }" class="rounded-lg shadow-lg bg-white">
                    <button @click="open = !open"
                        class="w-full text-left p-4 bg-red-500 text-white rounded-t-lg flex items-center justify-between">
                        <h2 class="text-lg font-semibold">Unverified Users</h2>
                        <svg :class="{ 'transform rotate-180': open }" class="w-5 h-5 transition-transform" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="unverified" x-show="open">

                    </div>
                </div>
            </div>
    </div>

    <script src="/scripts/user-panel.js"></script>
</body>

</html>
